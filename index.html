<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 全臺跨年晚會及元旦升旗</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="2027 跨年與升旗">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lightBg: '#f8fafc',
                        cardBg: '#ffffff',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons & Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .clean-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
        }
        .clean-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .clean-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
        }
        .locked-card {
            background: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
            opacity: 0.65;
            filter: grayscale(80%);
            pointer-events: none;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes softGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.08); }
        }
        .animate-soft-glow { animation: softGlow 8s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20 md:pb-0">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-200/50 rounded-full blur-3xl animate-soft-glow"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-purple-200/40 rounded-full blur-3xl animate-soft-glow" style="animation-delay: 2s;"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-pink-200/40 rounded-full blur-3xl animate-soft-glow" style="animation-delay: 4s;"></div>
    </div>

    <header class="sticky top-0 z-40 clean-panel border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-pink-500 flex items-center justify-center shadow-md shadow-indigo-500/20">
                    <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg bg-gradient-to-r from-slate-900 via-indigo-900 to-indigo-600 bg-clip-text text-transparent">2027 全台跨年晚會及元旦升旗</h1>
                    <p class="text-xs text-slate-500 hidden sm:block">跨年煙火、元旦升旗與活動即時行程總覽</p>
                </div>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden md:flex items-center space-x-1">
                <button onclick="switchTab('home')" id="nav-home" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition text-indigo-600 bg-indigo-50 flex items-center space-x-2">
                    <i data-lucide="compass" class="w-4 h-4"></i><span>探索活動</span>
                </button>
                <button onclick="switchTab('bookmarks')" id="nav-bookmarks" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center space-x-2">
                    <i data-lucide="bookmark" class="w-4 h-4"></i><span>我的收藏 <span id="bookmark-badge" class="ml-1 px-1.5 py-0.5 text-xs bg-indigo-600 text-white rounded-full">0</span></span>
                </button>
                <button onclick="switchTab('admin')" id="nav-admin" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center space-x-2">
                    <i data-lucide="shield-check" class="w-4 h-4"></i><span>管理系統</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 z-10 relative">

        <!-- ==================== HOME TAB ==================== -->
        <div id="view-home" class="space-y-8 animate-fadeIn">
            
            <!-- Hero Carousel Banner -->
            <div class="relative rounded-2xl overflow-hidden clean-panel border border-indigo-100 shadow-xl h-64 sm:h-80 bg-slate-900">
                <div id="hero-carousel-container" class="relative w-full h-full"></div>
                <div id="carousel-dots" class="absolute bottom-4 left-0 right-0 flex justify-center space-x-2 z-20"></div>
                <button onclick="prevSlide()" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center transition z-25">
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                </button>
                <button onclick="nextSlide()" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center transition z-25">
                    <i data-lucide="chevron-right" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Search & Filter Bar -->
            <div id="event-section" class="space-y-4 pt-2">
                <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                    <div class="relative w-full md:w-96">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="search-input" oninput="filterEvents()" placeholder="搜尋縣市、晚會名稱、地點..." 
                            class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/25 transition shadow-sm">
                    </div>

                    <div class="flex items-center space-x-1.5 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 hide-scrollbar">
                        <button onclick="setCategory('all')" class="cat-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap bg-indigo-600 text-white shadow-md shadow-indigo-600/20" data-cat="all">全部活動</button>
                        <button onclick="setCategory('跨年晚會')" class="cat-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 shadow-sm" data-cat="跨年晚會">跨年晚會</button>
                        <button onclick="setCategory('元旦升旗')" class="cat-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 shadow-sm" data-cat="元旦升旗">元旦升旗</button>
                        <button onclick="setCategory('燈會')" class="cat-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 shadow-sm" data-cat="燈會">燈會活動</button>
                    </div>
                </div>

                <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 hide-scrollbar pt-1">
                    <button onclick="setRegion('all')" class="region-tab px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-white transition whitespace-nowrap" data-region="all">全臺</button>
                    <button onclick="setRegion('北部')" class="region-tab px-3 py-1.5 rounded-lg text-xs font-medium bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition whitespace-nowrap" data-region="北部">北部</button>
                    <button onclick="setRegion('中部')" class="region-tab px-3 py-1.5 rounded-lg text-xs font-medium bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition whitespace-nowrap" data-region="中部">中部</button>
                    <button onclick="setRegion('南部')" class="region-tab px-3 py-1.5 rounded-lg text-xs font-medium bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition whitespace-nowrap" data-region="南部">南部</button>
                    <button onclick="setRegion('東部與離島')" class="region-tab px-3 py-1.5 rounded-lg text-xs font-medium bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition whitespace-nowrap" data-region="東部與離島">東部與離島</button>
                </div>

                <div class="flex items-center justify-between text-xs text-slate-500 px-1">
                    <span id="result-count">載入中...</span>
                    <span></span>
                </div>
            </div>

            <!-- Events Grid -->
            <div id="events-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
                <div class="w-16 h-16 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-400 mb-4 shadow-inner">
                    <i data-lucide="frown" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-semibold text-slate-800 mb-1">找不到符合的活動</h3>
                <button onclick="resetSearch()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium shadow-sm">清除搜尋條件</button>
            </div>
        </div>

        <!-- ==================== BOOKMARKS TAB ==================== -->
        <div id="view-bookmarks" class="space-y-6 hidden animate-fadeIn">
            <div class="clean-panel p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-2xl font-bold text-slate-900 flex items-center space-x-2">
                        <i data-lucide="bookmark" class="w-6 h-6 text-indigo-600"></i>
                        <span>我的收藏清單</span>
                    </h2>
                    <span id="bookmark-count-label" class="text-xs text-slate-600 bg-slate-100 px-3 py-1 rounded-full border border-slate-200">0 個活動</span>
                </div>
            </div>
            <div id="bookmarks-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="bookmarks-empty" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-16 h-16 rounded-2xl bg-indigo-50 flex items-center justify-center text-indigo-600 mb-4">
                    <i data-lucide="bookmark-plus" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-semibold text-slate-800 mb-1">目前還沒有收藏任何活動</h3>
                <button onclick="switchTab('home')" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-medium shadow-md mt-2">去探索活動</button>
            </div>
        </div>

        <!-- ==================== ADMIN TAB ==================== -->
        <div id="view-admin" class="space-y-6 hidden animate-fadeIn">
            <div id="admin-login-box" class="clean-panel p-8 rounded-2xl border border-indigo-100 shadow-xl max-w-md mx-auto text-center space-y-4 my-12">
                <div class="w-14 h-14 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg">
                    <i data-lucide="lock" class="w-7 h-7"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-slate-900">管理者系統安全登入</h3>
                    <p class="text-xs text-slate-500 mt-1">請輸入您的管理員密碼</p>
                </div>
                <div class="flex space-x-2 pt-2">
                    <input type="password" id="admin-password-input" placeholder="請輸入密碼..." class="flex-1 px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none">
                    <button onclick="verifyAdminPassword()" class="px-5 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl">登入</button>
                </div>
            </div>

            <div id="admin-content-box" class="clean-panel p-6 sm:p-8 rounded-2xl border border-indigo-100 shadow-xl hidden">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 border-b border-slate-200 gap-4">
                    <div>
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-700 border border-indigo-200">後台控制台</span>
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700 border border-emerald-200">已驗證授權</span>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-900">全臺跨年與元旦升旗行程管理</h2>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <button onclick="openPasswordChangeModal()" class="px-4 py-2.5 bg-white hover:bg-slate-50 text-slate-700 rounded-xl text-sm font-medium border border-slate-200 shadow-sm flex items-center space-x-1.5 transition">
                            <i data-lucide="key" class="w-4 h-4 text-indigo-600"></i><span>修改密碼</span>
                        </button>
                        <button onclick="openSyncModal()" class="px-4 py-2.5 bg-white hover:bg-slate-50 text-indigo-600 rounded-xl text-sm font-medium border border-slate-200 shadow-sm flex items-center space-x-1.5 transition">
                            <i data-lucide="cloud-sync" class="w-4 h-4"></i><span>試算表 / API 同步</span>
                        </button>
                        <button onclick="openAddModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium flex items-center space-x-2 shadow-lg shadow-indigo-600/25 transition">
                            <i data-lucide="plus" class="w-4 h-4"></i><span>新增活動</span>
                        </button>
                        <button onclick="resetDefaultData()" class="px-4 py-2.5 bg-white hover:bg-slate-50 text-slate-700 rounded-xl text-sm font-medium border border-slate-200 shadow-sm transition">
                            載入預設資料
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 my-6">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm"><div class="text-slate-500 text-xs mb-1">總活動數量</div><div id="stat-total" class="text-2xl font-bold text-slate-900">0</div></div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm"><div class="text-slate-500 text-xs mb-1">已開放 / 已解鎖</div><div id="stat-open" class="text-2xl font-bold text-emerald-600">0</div></div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm"><div class="text-slate-500 text-xs mb-1">尚未公布 (鎖定)</div><div id="stat-locked" class="text-2xl font-bold text-rose-600">0</div></div>
                </div>

                <div>
                    <h3 class="text-lg font-semibold text-slate-800 mb-4">活動清單與狀態設定</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-700">
                            <thead class="bg-slate-100 text-slate-600 text-xs uppercase border-b border-slate-200">
                                <tr>
                                    <th class="p-3.5">狀態</th>
                                    <th class="p-3.5">活動名稱 / 縣市</th>
                                    <th class="p-3.5">類型</th>
                                    <th class="p-3.5">時間</th>
                                    <th class="p-3.5 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body" class="divide-y divide-slate-200"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 clean-panel border-t border-slate-200 px-4 py-2 flex justify-around items-center shadow-lg">
        <button onclick="switchTab('home')" id="mob-nav-home" class="mob-tab flex flex-col items-center justify-center py-1 px-3 text-indigo-600"><i data-lucide="compass" class="w-5 h-5 mb-1"></i><span class="text-[10px]">探索</span></button>
        <button onclick="switchTab('bookmarks')" id="mob-nav-bookmarks" class="mob-tab flex flex-col items-center justify-center py-1 px-3 text-slate-500"><i data-lucide="bookmark" class="w-5 h-5 mb-1"></i><span class="text-[10px]">收藏</span></button>
        <button onclick="switchTab('admin')" id="mob-nav-admin" class="mob-tab flex flex-col items-center justify-center py-1 px-3 text-slate-500"><i data-lucide="shield-check" class="w-5 h-5 mb-1"></i><span class="text-[10px]">管理</span></button>
    </nav>

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden">
        <div class="clean-panel w-full max-w-2xl rounded-2xl overflow-hidden border border-slate-200 shadow-2xl max-h-[90vh] flex flex-col bg-white">
            <div id="modal-content" class="overflow-y-auto p-6 space-y-6"></div>
            <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end space-x-3">
                <button onclick="closeDetailModal()" class="px-5 py-2.5 rounded-xl bg-white text-slate-700 text-sm border">關閉</button>
                <button id="modal-bookmark-btn" onclick="toggleBookmarkFromModal()" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-medium flex items-center space-x-2"><i data-lucide="bookmark" class="w-4 h-4"></i><span>加入收藏</span></button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <div class="relative max-w-5xl max-h-[95vh] w-full flex flex-col items-center justify-center" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute top-2 right-2 text-white p-2 bg-black/50 rounded-full"><i data-lucide="x" class="w-6 h-6"></i></button>
            <img id="lightbox-img" src="" alt="放大預覽" class="max-h-[85vh] max-w-full object-contain rounded-xl shadow-2xl bg-slate-900">
        </div>
    </div>

    <!-- Form Modal (新增與編輯活動) -->
    <div id="form-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden">
        <div class="clean-panel w-full max-w-2xl rounded-2xl overflow-hidden border border-indigo-200 shadow-2xl max-h-[90vh] flex flex-col bg-white">
            <div class="p-6 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h3 id="form-modal-title" class="text-xl font-bold text-slate-900">新增活動</h3>
                <button onclick="closeFormModal()"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <form id="event-form" onsubmit="handleFormSubmit(event)" class="overflow-y-auto p-6 space-y-4">
                <input type="hidden" id="event-id">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">活動類型 *</label>
                        <select id="input-category" required class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm">
                            <option value="跨年晚會">跨年晚會</option><option value="元旦升旗">元旦升旗</option><option value="燈會">燈會</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">所屬縣市 *</label>
                        <select id="input-city" required class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm">
                            <option value="臺北市">臺北市</option><option value="新北市">新北市</option><option value="基隆市">基隆市</option><option value="桃園市">桃園市</option><option value="新竹市">新竹市</option><option value="新竹縣">新竹縣</option><option value="宜蘭縣">宜蘭縣</option><option value="苗栗縣">苗栗縣</option><option value="臺中市">臺中市</option><option value="彰化縣">彰化縣</option><option value="南投縣">南投縣</option><option value="雲林縣">雲林縣</option><option value="嘉義市">嘉義市</option><option value="嘉義縣">嘉義縣</option><option value="臺南市">臺南市</option><option value="高雄市">高雄市</option><option value="屏東縣">屏東縣</option><option value="花蓮縣">花蓮縣</option><option value="臺東縣">臺東縣</option><option value="澎湖縣">澎湖縣</option><option value="金門縣">金門縣</option><option value="連江縣">連江縣</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">開放狀態 *</label>
                        <select id="input-status" required class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm">
                            <option value="open">開放 (可點擊瀏覽)</option><option value="locked">尚未公布 (反灰鎖定)</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">活動名稱 *</label><input type="text" id="input-name" required class="w-full px-3.5 py-2.5 border rounded-xl text-sm"></div>
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">活動時間 *</label><input type="text" id="input-time" required class="w-full px-3.5 py-2.5 border rounded-xl text-sm"></div>
                </div>
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">活動地點 *</label><input type="text" id="input-location" required class="w-full px-3.5 py-2.5 border rounded-xl text-sm"></div>
                
                <!-- 圖片上傳與預覽 -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">主視覺圖片上傳</label><input type="file" id="input-image-file" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-indigo-600 file:text-white"></div>
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">或圖片網址 (URL)</label><input type="url" id="input-image" class="w-full px-3.5 py-2.5 border rounded-xl text-sm"></div>
                </div>
                <div id="image-preview-container" class="hidden mt-2"><img id="image-preview" src="" alt="Preview" class="h-32 object-cover rounded-xl border"></div>
                
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">官方活動連結</label><input type="url" id="input-link" class="w-full px-3.5 py-2.5 border rounded-xl text-sm"></div>
                
                <!-- 活動時刻表手寫輸入 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">活動時刻表 / 演出順序 (每行一筆)</label>
                    <textarea id="input-desc" rows="4" placeholder="19:00 - 20:00 | 暖身開場&#10;20:00 - 23:00 | 巨星開唱" class="w-full px-3.5 py-2.5 border rounded-xl text-sm font-mono"></textarea>
                </div>

                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeFormModal()" class="px-5 py-2.5 rounded-xl bg-white border text-sm">取消</button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white text-sm shadow-lg">儲存活動</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Password Change Modal -->
    <div id="password-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden">
        <div class="clean-panel w-full max-w-md rounded-2xl overflow-hidden border border-slate-200 shadow-2xl flex flex-col bg-white p-6 space-y-4">
            <div class="flex items-center justify-between"><h3 class="text-lg font-bold text-slate-900">修改管理者密碼</h3><button onclick="closePasswordChangeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
            <div class="space-y-3">
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">新密碼</label><input type="password" id="new-password-input" class="w-full px-3.5 py-2.5 border rounded-xl text-sm"></div>
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">確認新密碼</label><input type="password" id="confirm-password-input" class="w-full px-3.5 py-2.5 border rounded-xl text-sm"></div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closePasswordChangeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">取消</button>
                <button onclick="saveNewPassword()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm">確認修改</button>
            </div>
        </div>
    </div>

    <!-- Sync Modal -->
    <div id="sync-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden">
        <div class="clean-panel w-full max-w-xl rounded-2xl overflow-hidden border border-slate-200 shadow-2xl flex flex-col bg-white">
            <div class="p-6 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h3 class="text-lg font-bold text-slate-900 flex items-center space-x-2"><i data-lucide="cloud-sync" class="w-5 h-5 text-indigo-600"></i><span>Google 試算表 / API 同步設定</span></h3>
                <button onclick="closeSyncModal()"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <p class="text-sm text-slate-600 leading-relaxed">請貼上您在 Google Apps Script 部署取得的 **Web App 網址**：</p>
                <input type="url" id="gas-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none">
            </div>
            <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end space-x-3">
                <button onclick="closeSyncModal()" class="px-5 py-2.5 rounded-xl bg-white text-slate-700 text-sm border">關閉</button>
                <button onclick="saveGasSettings()" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm">儲存並立即連線</button>
            </div>
        </div>
    </div>

    <script>
        const REGION_MAP = {
            '臺北市': '北部', '新北市': '北部', '基隆市': '北部', '桃園市': '北部', '新竹市': '北部', '新竹縣': '北部', '宜蘭縣': '北部',
            '臺中市': '中部', '苗栗縣': '中部', '彰化縣': '中部', '南投縣': '中部', '雲林縣': '中部',
            '臺南市': '南部', '高雄市': '南部', '屏東縣': '南部', '嘉義市': '南部', '嘉義縣': '南部',
            '花蓮縣': '東部與離島', '臺東縣': '東部與離島', '澎湖縣': '東部與離島', '金門縣': '東部與離島', '連江縣': '東部與離島'
        };

        const HERO_SLIDES = [
            { title: '2027 臺北最HIGH新年城', subtitle: '全臺指標跨年煙火與頂尖巨星狂歡', image: 'https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1200&q=80' },
            { title: '2027 總統府元旦升旗典禮', subtitle: '迎向新局，齊心迎接曙光', image: 'https://images.unsplash.com/photo-1533227268428-f9ed0900fb3b?auto=format&fit=crop&w=1200&q=80' },
            { title: '2027 幸福臺中跨年晚會', subtitle: '水湳中央公園璀璨開唱', image: 'https://images.unsplash.com/photo-1498931299472-f7a63a5a1cfa?auto=format&fit=crop&w=1200&q=80' }
        ];
        let currentSlideIdx = 0;
        let carouselInterval = null;

        function initCarousel() {
            const container = document.getElementById('hero-carousel-container');
            const dots = document.getElementById('carousel-dots');
            if (!container || !dots) return;
            container.innerHTML = HERO_SLIDES.map((slide, idx) => `
                <div class="absolute inset-0 transition-opacity duration-1000 ease-in-out ${idx === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'} carousel-slide" data-idx="${idx}">
                    <img src="${slide.image}" alt="${slide.title}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/30 to-transparent"></div>
                    <div class="absolute bottom-6 left-6 right-6 text-white z-10">
                        <span class="px-2.5 py-1 rounded-md bg-indigo-600 text-xs font-bold mb-2 inline-block shadow">精選活動</span>
                        <h3 class="text-2xl sm:text-3xl font-extrabold drop-shadow">${slide.title}</h3>
                        <p class="text-xs sm:text-sm text-slate-200 mt-1 drop-shadow">${slide.subtitle}</p>
                    </div>
                </div>
            `).join('');
            dots.innerHTML = HERO_SLIDES.map((_, idx) => `
                <button onclick="goToSlide(${idx})" class="w-2.5 h-2.5 rounded-full transition-all ${idx === 0 ? 'bg-white w-6' : 'bg-white/50 hover:bg-white/80'} carousel-dot" data-idx="${idx}"></button>
            `).join('');
            startCarousel();
        }

        function startCarousel() {
            if (carouselInterval) clearInterval(carouselInterval);
            carouselInterval = setInterval(() => { nextSlide(); }, 5000);
        }
        function nextSlide() { currentSlideIdx = (currentSlideIdx + 1) % HERO_SLIDES.length; updateCarousel(); }
        function prevSlide() { currentSlideIdx = (currentSlideIdx - 1 + HERO_SLIDES.length) % HERO_SLIDES.length; updateCarousel(); }
        function goToSlide(idx) { currentSlideIdx = idx; updateCarousel(); startCarousel(); }
        function updateCarousel() {
            document.querySelectorAll('.carousel-slide').forEach((slide, idx) => {
                slide.className = `absolute inset-0 transition-opacity duration-1000 ease-in-out ${idx === currentSlideIdx ? 'opacity-100 z-10' : 'opacity-0 z-0'} carousel-slide`;
            });
            document.querySelectorAll('.carousel-dot').forEach((dot, idx) => {
                dot.className = `w-2.5 h-2.5 rounded-full transition-all ${idx === currentSlideIdx ? 'bg-white w-6' : 'bg-white/50 hover:bg-white/80'} carousel-dot`;
            });
        }

        const DEFAULT_EVENTS = [
            { id: 't-1', category: '燈會', name: '2027 台灣燈會在嘉義', city: '嘉義縣', region: '南部', time: '2027/02/05', location: '嘉義縣展區', status: 'locked', image: '', link: '', desc: '活動籌備中，敬請期待。' },
            { id: 'f-1', category: '元旦升旗', name: '中華民國116年元旦總統府升旗典禮', city: '臺北市', region: '北部', time: '2027/01/01 05:30', location: '總統府前廣場', status: 'open', image: '', link: 'https://www.president.gov.tw', desc: '05:30 - 06:00 | 民眾進場\n06:00 - 06:30 | 國歌領唱與表演活動\n06:30 - 08:30 | 正式升旗典禮' }
        ];

        let events = [];
        let bookmarks = [];
        let currentCategory = 'all';
        let currentRegion = 'all';
        let currentSearchQuery = '';
        let currentActiveTab = 'home';
        let currentModalEventId = null;
        let isAdminUnlocked = false;

        window.onload = async function() {
            await loadData();
            loadBookmarks();
            renderEvents();
            renderBookmarks();
            renderAdminTable();
            updateStats();
            initCarousel();
            lucide.createIcons();
        };

        async function loadData() {
            const GAS_URL = localStorage.getItem('tw_nye_gas_url_light') || "";
            if (GAS_URL) {
                try {
                    const res = await fetch(GAS_URL);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        events = data.map(e => ({
                            ...e,
                            region: e.region || REGION_MAP[e.city] || '北部',
                            status: e.status || 'open'
                        }));
                        return;
                    }
                } catch (err) {
                    console.error("從 Google 試算表讀取失敗，改用本機資料", err);
                }
            }
            const saved = localStorage.getItem('tw_nye_events_2027_light_v7');
            if (saved) {
                try { events = JSON.parse(saved); } catch (e) { events = DEFAULT_EVENTS; }
            } else {
                events = DEFAULT_EVENTS;
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('tw_nye_events_2027_light_v7', JSON.stringify(events));
            updateStats();
        }

        function loadBookmarks() {
            const saved = localStorage.getItem('tw_nye_bookmarks_2027_light_v7');
            if (saved) { try { bookmarks = JSON.parse(saved); } catch (e) { bookmarks = []; } }
            updateBookmarkBadge();
        }
        function saveBookmarks() {
            localStorage.setItem('tw_nye_bookmarks_2027_light_v7', JSON.stringify(bookmarks));
            updateBookmarkBadge();
        }
        function updateBookmarkBadge() {
            const count = bookmarks.length;
            document.getElementById('bookmark-badge').innerText = count;
            document.getElementById('bookmark-count-label').innerText = `${count} 個活動`;
        }

        function switchTab(tabId) {
            currentActiveTab = tabId;
            ['home', 'bookmarks', 'admin'].forEach(t => {
                const el = document.getElementById(`view-${t}`);
                if (el) el.classList.add('hidden');
            });
            const target = document.getElementById(`view-${tabId}`);
            if (target) target.classList.remove('hidden');

            ['home', 'bookmarks', 'admin'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    btn.className = t === tabId ? "nav-btn px-4 py-2 rounded-xl text-sm font-medium transition text-indigo-600 bg-indigo-50 flex items-center space-x-2" : "nav-btn px-4 py-2 rounded-xl text-sm font-medium transition text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center space-x-2";
                }
            });
            if (tabId === 'admin') updateAdminAuthView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verifyAdminPassword() {
            const pwd = document.getElementById('admin-password-input').value;
            if (!pwd) { alert('請輸入密碼！'); return; }
            const hash = await sha256(pwd);
            let targetHash = localStorage.getItem('tw_nye_admin_hash');
            if (!targetHash) {
                localStorage.setItem('tw_nye_admin_hash', hash);
                targetHash = hash;
                alert('已為您初始化設定此密碼為管理員密碼！');
            }
            if (hash === targetHash) {
                isAdminUnlocked = true;
                updateAdminAuthView();
                document.getElementById('admin-password-input').value = '';
            } else {
                alert('密碼錯誤！');
            }
        }

        function updateAdminAuthView() {
            const loginBox = document.getElementById('admin-login-box');
            const contentBox = document.getElementById('admin-content-box');
            if (isAdminUnlocked) {
                loginBox.classList.add('hidden');
                contentBox.classList.remove('hidden');
                renderAdminTable();
                updateStats();
            } else {
                loginBox.classList.remove('hidden');
                contentBox.classList.add('hidden');
            }
        }

        function openPasswordChangeModal() { document.getElementById('password-modal').classList.remove('hidden'); }
        function closePasswordChangeModal() { document.getElementById('password-modal').classList.add('hidden'); }

        async function saveNewPassword() {
            const p1 = document.getElementById('new-password-input').value;
            const p2 = document.getElementById('confirm-password-input').value;
            if (!p1 || p1 !== p2) { alert('兩次輸入的密碼不一致或為空！'); return; }
            const newHash = await sha256(p1);
            localStorage.setItem('tw_nye_admin_hash', newHash);
            alert('管理者密碼已成功修改！');
            closePasswordChangeModal();
            document.getElementById('new-password-input').value = '';
            document.getElementById('confirm-password-input').value = '';
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-tab').forEach(btn => {
                btn.className = btn.getAttribute('data-cat') === cat ? "cat-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap bg-indigo-600 text-white shadow-md" : "cat-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 shadow-sm";
            });
            renderEvents();
        }

        function setRegion(region) {
            currentRegion = region;
            document.querySelectorAll('.region-tab').forEach(btn => {
                btn.className = btn.getAttribute('data-region') === region ? "region-tab px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-white transition whitespace-nowrap" : "region-tab px-3 py-1.5 rounded-lg text-xs font-medium bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition whitespace-nowrap";
            });
            renderEvents();
        }

        function filterEvents() {
            currentSearchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            renderEvents();
        }

        function resetSearch() {
            document.getElementById('search-input').value = '';
            currentSearchQuery = '';
            setCategory('all');
            setRegion('all');
        }

        function renderEvents() {
            const grid = document.getElementById('events-grid');
            const emptyState = document.getElementById('empty-state');
            
            let filtered = events.filter(e => {
                const matchCat = (currentCategory === 'all' || e.category === currentCategory);
                const matchRegion = (currentRegion === 'all' || e.region === currentRegion);
                const matchSearch = !currentSearchQuery || 
                    (e.name && e.name.toLowerCase().includes(currentSearchQuery)) ||
                    (e.city && e.city.toLowerCase().includes(currentSearchQuery)) ||
                    (e.location && e.location.toLowerCase().includes(currentSearchQuery));
                return matchCat && matchRegion && matchSearch;
            });

            document.getElementById('result-count').innerText = `共找到 ${filtered.length} 場活動`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            grid.innerHTML = filtered.map(e => {
                const isBookmarked = bookmarks.includes(String(e.id));
                const isLocked = (e.status === 'locked' || e.status === 'Locked');
                
                let imageHtml = e.image && e.image.trim() !== '' ? 
                    `<img src="${e.image}" alt="${e.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" ${isLocked ? '' : `onclick="openDetailModal('${e.id}')"`}>` :
                    `<div class="w-full h-full flex items-center justify-center p-4 text-center ${isLocked ? '' : 'cursor-pointer'} bg-gradient-to-br from-indigo-900 to-slate-900" ${isLocked ? '' : `onclick="openDetailModal('${e.id}')"`}><span class="text-white font-bold text-lg drop-shadow-md">${e.name}</span></div>`;

                let badgeColor = e.category === '元旦升旗' ? 'bg-rose-600' : (e.category === '燈會' ? 'bg-amber-600' : 'bg-indigo-600');

                return `
                    <div class="clean-card rounded-2xl overflow-hidden flex flex-col group shadow-sm ${isLocked ? 'locked-card' : ''}">
                        <div class="relative h-52 overflow-hidden flex items-center justify-center bg-slate-900">
                            ${imageHtml}
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 via-transparent to-transparent pointer-events-none"></div>
                            <span class="absolute top-3 left-3 px-2.5 py-1 rounded-lg text-xs font-semibold ${badgeColor} text-white shadow-md">${e.city} · ${e.category}</span>
                            
                            ${isLocked ? `
                                <div class="absolute inset-0 bg-slate-900/70 backdrop-blur-xs flex flex-col items-center justify-center text-white p-4 text-center">
                                    <i data-lucide="lock" class="w-8 h-8 mb-2 text-rose-400"></i>
                                    <span class="font-bold text-base">尚未公布 (鎖定中)</span>
                                </div>
                            ` : `
                                <button onclick="event.stopPropagation(); toggleBookmark('${e.id}')" class="absolute top-3 right-3 p-2 rounded-xl bg-white/95 text-slate-700 hover:bg-indigo-600 hover:text-white transition shadow-md">
                                    <i data-lucide="bookmark" class="w-4 h-4 ${isBookmarked ? 'fill-indigo-600 text-indigo-600' : ''}"></i>
                                </button>
                            `}

                            <div class="absolute bottom-3 left-3 text-xs text-white pointer-events-none">
                                <span class="bg-slate-900/70 px-2 py-1 rounded-md">${e.time ? e.time.split(' ')[0] : ''}</span>
                            </div>
                        </div>

                        <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                            <div class="space-y-2 ${isLocked ? '' : 'cursor-pointer'}" ${isLocked ? '' : `onclick="openDetailModal('${e.id}')"`}>
                                <h3 class="font-bold text-lg text-slate-900 group-hover:text-indigo-600 transition line-clamp-1">${e.name}</h3>
                                <p class="text-xs text-slate-500 flex items-center space-x-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-500 shrink-0"></i><span class="line-clamp-1">${e.location}</span></p>
                            </div>

                            <div class="pt-3 border-t border-slate-100">
                                ${isLocked ? `
                                    <div class="w-full py-2.5 rounded-xl bg-slate-100 text-slate-400 text-xs font-semibold flex items-center justify-center space-x-1.5"><i data-lucide="lock" class="w-4 h-4"></i><span>尚未開放瀏覽</span></div>
                                ` : `
                                    <button onclick="openDetailModal('${e.id}')" class="w-full py-2.5 rounded-xl bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white text-xs font-semibold transition border border-indigo-200 flex items-center justify-center space-x-1.5 shadow-sm"><i data-lucide="calendar-days" class="w-4 h-4"></i><span>更多活動資訊</span></button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function toggleBookmark(id) {
            const e = events.find(item => String(item.id) === String(id));
            if (e && (e.status === 'locked' || e.status === 'Locked')) return;
            const index = bookmarks.indexOf(String(id));
            if (index > -1) bookmarks.splice(index, 1); else bookmarks.push(String(id));
            saveBookmarks();
            renderEvents();
            renderBookmarks();
        }

        function renderBookmarks() {
            const grid = document.getElementById('bookmarks-grid');
            const empty = document.getElementById('bookmarks-empty');
            const bookmarkedEvents = events.filter(e => bookmarks.includes(String(e.id)) && e.status !== 'locked' && e.status !== 'Locked');

            if (bookmarkedEvents.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                empty.classList.add('flex');
                return;
            }
            empty.classList.add('hidden');
            empty.classList.remove('flex');

            grid.innerHTML = bookmarkedEvents.map(e => `
                <div class="clean-card rounded-2xl overflow-hidden flex flex-col shadow-sm">
                    <div class="relative h-44 overflow-hidden flex items-center justify-center bg-slate-900 cursor-pointer" onclick="openDetailModal('${e.id}')">
                        ${e.image ? `<img src="${e.image}" alt="${e.name}" class="w-full h-full object-cover">` : `<span class="text-white font-bold p-3 text-center">${e.name}</span>`}
                        <span class="absolute top-3 left-3 px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white">${e.city}</span>
                        <button onclick="event.stopPropagation(); toggleBookmark('${e.id}')" class="absolute top-3 right-3 p-2 rounded-xl bg-white/95 text-indigo-600 hover:bg-slate-100 transition shadow-md"><i data-lucide="bookmark" class="w-4 h-4 fill-indigo-600"></i></button>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <h3 class="font-bold text-base text-slate-900 mb-1">${e.name}</h3>
                            <p class="text-xs text-slate-500 mb-2"><i data-lucide="calendar" class="w-3.5 h-3.5 inline mr-1 text-indigo-600"></i>${e.time}</p>
                            <p class="text-xs text-slate-600 line-clamp-2"><strong class="text-indigo-600">地點：</strong>${e.location}</p>
                        </div>
                        <button onclick="openDetailModal('${e.id}')" class="w-full py-2.5 rounded-xl bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white text-xs font-semibold transition border border-indigo-200">更多活動資訊</button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function parseScheduleToTimeline(descText) {
            if (!descText) return `<p class="text-xs text-slate-400 text-center py-2">尚無詳細行程說明。</p>`;
            const lines = String(descText).split('\n').filter(l => l.trim().length > 0);
            return `<div class="space-y-2.5">${lines.map(line => {
                let parts = line.includes('|') ? line.split('|') : [line, ''];
                let timeStr = parts[0] ? parts[0].trim() : '';
                let actStr = parts[1] ? parts[1].trim() : line.trim();
                return `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between py-3 px-4 bg-white rounded-xl border border-slate-100 shadow-2xs">
                        ${timeStr ? `<span class="font-mono text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg mb-1.5 sm:mb-0 w-fit">${timeStr}</span>` : '<span></span>'}
                        <span class="text-xs sm:text-sm font-medium text-slate-700 sm:text-right pl-1">${actStr}</span>
                    </div>
                `;
            }).join('')}</div>`;
        }

        function openDetailModal(id) {
            const e = events.find(item => String(item.id) === String(id));
            if (!e || e.status === 'locked' || e.status === 'Locked') return;

            currentModalEventId = id;
            const isBookmarked = bookmarks.includes(String(id));
            const content = document.getElementById('modal-content');
            
            let modalImgHtml = e.image ? `<img src="${e.image}" alt="${e.name}" class="w-full h-full object-cover cursor-pointer" onclick="openLightbox('${e.image}')">` : `<div class="w-full h-full flex items-center justify-center p-6 text-center bg-gradient-to-br from-indigo-900 to-slate-900"><span class="text-white font-extrabold text-xl">${e.name}</span></div>`;

            content.innerHTML = `
                <div class="relative rounded-xl overflow-hidden h-72 sm:h-96 bg-slate-900 flex items-center justify-center border shadow-inner">
                    ${modalImgHtml}
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 via-transparent to-transparent pointer-events-none"></div>
                    <div class="absolute bottom-4 left-4 right-4 pointer-events-none">
                        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-600 text-white mb-2 inline-block">${e.city} (${e.category})</span>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-white drop-shadow-md">${e.name}</h2>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-xl border space-y-1"><div class="text-xs text-slate-500"><i data-lucide="calendar" class="w-4 h-4 text-indigo-600 inline mr-1"></i>活動時間</div><div class="text-sm font-semibold text-slate-900">${e.time}</div></div>
                    <div class="bg-slate-50 p-4 rounded-xl border space-y-1"><div class="text-xs text-slate-500"><i data-lucide="map-pin" class="w-4 h-4 text-rose-500 inline mr-1"></i>活動地點</div><div class="text-sm font-semibold text-slate-900">${e.location}</div></div>
                </div>
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider"><i data-lucide="list-ordered" class="w-4 h-4 text-indigo-600 inline mr-1"></i>活動時刻表 / 演出順序</h4>
                    ${parseScheduleToTimeline(e.desc)}
                </div>
                ${e.link ? `<div class="pt-2"><a href="${e.link}" target="_blank" class="inline-flex items-center space-x-2 text-sm text-indigo-600 font-medium bg-indigo-50 px-4 py-2.5 rounded-xl border border-indigo-200"><i data-lucide="external-link" class="w-4 h-4"></i><span>前往官方網站 / 活動專頁</span></a></div>` : ''}
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }
        function toggleBookmarkFromModal() { if (currentModalEventId) { toggleBookmark(currentModalEventId); openDetailModal(currentModalEventId); } }
        function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox-modal').classList.remove('hidden'); }
        function closeLightbox() { document.getElementById('lightbox-modal').classList.add('hidden'); }

        // Admin Table & Management
        function renderAdminTable() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = events.map(e => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3.5"><span class="px-2 py-1 rounded text-xs font-bold ${e.status === 'open' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${e.status === 'open' ? '開放' : '鎖定'}</span></td>
                    <td class="p-3.5"><div class="font-bold text-slate-900">${e.name}</div><div class="text-xs text-indigo-600">${e.city} | ${e.region}</div></td>
                    <td class="p-3.5 text-xs font-semibold text-slate-700">${e.category}</td>
                    <td class="p-3.5 text-xs text-slate-600">${e.time}</td>
                    <td class="p-3.5 text-right space-x-2">
                        <button onclick="openEditModal('${e.id}')" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-700 text-xs font-medium transition border border-slate-200 shadow-sm">編輯</button>
                        <button onclick="deleteEvent('${e.id}')" class="px-3 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white text-xs font-medium transition border border-rose-200 shadow-sm">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = events.length;
            document.getElementById('stat-open').innerText = events.filter(e => e.status === 'open').length;
            document.getElementById('stat-locked').innerText = events.filter(e => e.status === 'locked').length;
        }

        function openAddModal() {
            document.getElementById('form-modal-title').innerText = '新增活動';
            document.getElementById('event-form').reset();
            document.getElementById('event-id').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('form-modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const e = events.find(item => String(item.id) === String(id));
            if (!e) return;
            document.getElementById('form-modal-title').innerText = '編輯活動';
            document.getElementById('event-id').value = e.id;
            document.getElementById('input-category').value = e.category || '跨年晚會';
            document.getElementById('input-city').value = e.city;
            document.getElementById('input-status').value = e.status || 'open';
            document.getElementById('input-name').value = e.name;
            document.getElementById('input-time').value = e.time;
            document.getElementById('input-location').value = e.location;
            document.getElementById('input-image').value = e.image || '';
            document.getElementById('input-link').value = e.link || '';
            document.getElementById('input-desc').value = e.desc || '';
            if (e.image) {
                document.getElementById('image-preview').src = e.image;
                document.getElementById('image-preview-container').classList.remove('hidden');
            } else {
                document.getElementById('image-preview-container').classList.add('hidden');
            }
            document.getElementById('form-modal').classList.remove('hidden');
        }

        function closeFormModal() { document.getElementById('form-modal').classList.add('hidden'); }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                document.getElementById('input-image').value = base64;
                document.getElementById('image-preview').src = base64;
                document.getElementById('image-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('event-id').value;
            const city = document.getElementById('input-city').value;
            const region = REGION_MAP[city] || '北部';
            const eventData = {
                id: id || 'evt-' + Date.now(),
                category: document.getElementById('input-category').value,
                name: document.getElementById('input-name').value,
                city: city,
                region: region,
                time: document.getElementById('input-time').value,
                location: document.getElementById('input-location').value,
                status: document.getElementById('input-status').value,
                image: document.getElementById('input-image').value || '',
                link: document.getElementById('input-link').value,
                desc: document.getElementById('input-desc').value
            };
            if (id) {
                const idx = events.findIndex(item => String(item.id) === String(id));
                if (idx > -1) events[idx] = eventData;
            } else {
                events.unshift(eventData);
            }
            saveData();
            renderEvents();
            renderBookmarks();
            renderAdminTable();
            closeFormModal();
        }

        function deleteEvent(id) {
            if (confirm('確定要刪除這項活動嗎？')) {
                events = events.filter(e => String(e.id) !== String(id));
                bookmarks = bookmarks.filter(bId => String(bId) !== String(id));
                saveData();
                saveBookmarks();
                renderEvents();
                renderBookmarks();
                renderAdminTable();
            }
        }

        function resetDefaultData() {
            if (confirm('確定要載入預設的活動清單嗎？')) {
                events = DEFAULT_EVENTS;
                saveData();
                renderEvents();
                renderBookmarks();
                renderAdminTable();
                alert('已成功恢復預設資料！');
            }
        }

        function openSyncModal() {
            document.getElementById('gas-url-input').value = localStorage.getItem('tw_nye_gas_url_light') || '';
            document.getElementById('sync-modal').classList.remove('hidden');
        }
        function closeSyncModal() { document.getElementById('sync-modal').classList.add('hidden'); }
        function saveGasSettings() {
            const url = document.getElementById('gas-url-input').value.trim();
            localStorage.setItem('tw_nye_gas_url_light', url);
            alert('已成功儲存！網頁即將重新整理以從 Google 試算表載入資料。');
            location.reload();
        }
    </script>
</body>
</html>
